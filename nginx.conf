# Nginx configuration for Fawkes Web Application
# Place this in /etc/nginx/sites-available/fawkes-web
# Then symlink to sites-enabled: ln -s /etc/nginx/sites-available/fawkes-web /etc/nginx/sites-enabled/

upstream fawkes_app {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    server_name your-domain.com;  # Change this to your domain
    
    # Redirect HTTP to HTTPS (uncomment when SSL is set up)
    # return 301 https://$server_name$request_uri;
    
    client_max_body_size 16M;
    
    # Timeouts for long-running requests
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    location / {
        proxy_pass http://fawkes_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
    
    # Optional: serve static files directly (if you add them)
    # location /static {
    #     alias /var/www/fawkes-web/static;
    #     expires 30d;
    # }
    
    # Health check endpoint
    location /health {
        proxy_pass http://fawkes_app;
        access_log off;
    }
}

